<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadyfy OS — Agency Management & Operations SaaS</title>
  <meta name="description" content="Production-grade internal Agency Management and Operations SaaS platform for User Generated Content (UGC) and digital marketing operations.">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="app-root">
    <!-- Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">L</div>
        <div class="brand-info">
          <span class="brand-title">LEADYFY OS</span>
          <span class="brand-tag">AGENCY OPERATIONS</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Injected dynamically based on role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" id="user-avatar-initials">VK</div>
          <div class="user-meta">
            <div class="user-name" id="user-display-name">Loading...</div>
            <span class="user-role-badge" id="user-display-role">OWNER</span>
          </div>
          <button class="logout-btn" id="logout-btn" title="Sign out">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="app-main">
      <header class="app-header">
        <div class="header-left">
          <div>
            <h1 class="page-heading-title" id="page-title">Executive Dashboard</h1>
            <div class="page-subheading" id="page-subtitle">Real-time Agency Operations & KPIs</div>
          </div>
        </div>

        <div class="header-right">
          <!-- Testing Role Switcher: Allows 1-click switching to test all RBAC roles & client isolation -->
          <div class="role-switcher-container" title="Switch between roles to test RBAC & Client Isolation">
            <span class="role-switcher-label">Role Switch:</span>
            <select class="role-select" id="role-switcher-select">
              <option value="owner@leadyfy.com">Owner (Vikram)</option>
              <option value="admin@leadyfy.com">Admin / Ops Manager (Neha)</option>
              <option value="writer@leadyfy.com">Script Writer (Aryan)</option>
              <option value="shootmgr@leadyfy.com">Shoot Manager (Sameer)</option>
              <option value="editor@leadyfy.com">Video Editor (Karan)</option>
              <option value="sales@leadyfy.com">Sales Rep (Anjali)</option>
              <option value="client1@glowbeauty.com">Client 1 (Glow Beauty)</option>
              <option value="client2@fitfuel.com">Client 2 (FitFuel)</option>
            </select>
          </div>

          <!-- Notification Bell -->
          <div style="position: relative; cursor: pointer;" id="notification-trigger">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--text-muted);"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span id="notification-unread-count" style="display: none; position: absolute; top: -6px; right: -6px; background-color: var(--color-amber); color: #111; font-size: 10px; font-weight: 800; border-radius: 10px; padding: 1px 5px;">0</span>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="app-content" id="view-container">
        <!-- Rendered by JavaScript -->
      </main>
    </div>
  </div>

  <!-- Global Modal Host -->
  <div class="modal-overlay" id="global-modal">
    <div class="modal-dialog" id="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Dialog</h3>
        <button class="modal-close" onclick="window.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Notification Host -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/views/dashboardView.js"></script>
  <script src="/js/views/clientsView.js"></script>
  <script src="/js/views/ordersView.js"></script>
  <script src="/js/views/scriptsView.js"></script>
  <script src="/js/views/creatorsView.js"></script>
  <script src="/js/views/shootsView.js"></script>
  <script src="/js/views/videosView.js"></script>
  <script src="/js/views/financeView.js"></script>
  <script src="/js/views/tasksView.js"></script>
  <script src="/js/views/supportView.js"></script>
  <script src="/js/views/auditView.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
